[workspace]
members = [
    "hdspace-common",
    "hdspace-models",
    "hdspace-renew",
    "hdspace-envsync",
    "hdspace-ratelimit",
    "skill-manager",
]
resolver = "2"

[workspace.metadata]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
